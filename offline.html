<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#172032" />
    <title>Our Little Diary · Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #f6ecdd; background: radial-gradient(ellipse at 50% 0, #35405a, #101626 62%); font: 16px/1.65 Georgia, serif; }
      main { width: min(460px, 100%); padding: 38px 30px; border: 1px solid #b99669; border-radius: 20px; background: rgba(255,255,255,.045); text-align: center; }
      .moon { color: #e8cfaa; font-size: 40px; }
      h1 { margin: 12px 0; font-size: 31px; font-weight: 400; }
      p { color: #c9c0bc; }
      a { display: inline-block; margin-top: 13px; padding: 12px 19px; border: 1px solid #c49a65; border-radius: 10px; color: #fff8eb; background: #a87541; text-decoration: none; }
    </style>
  </head>
  <body><main><span class="moon" aria-hidden="true">☾</span><h1>We need a little signal.</h1><p>The diary can open when you’re online. Your saved memories stay private in the diary; this app only keeps shared files on this device while you review them.</p><a href="/">Try again</a></main></body>
</html>
